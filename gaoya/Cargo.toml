[package]
name = "gaoya"
version = "0.2.1"
authors = ["Sergejs Melderis <sergey.melderis@gmail.com>"]
edition = "2024"
readme = "../README.md"
homepage = "https://github.com/serega/gaoya"
repository = "https://github.com/serega/gaoya"
license = "MIT"
keywords = ["lsh",  "neardup", "dedup"]
description = "Locality Sensitive Hashing Data Structures"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "lsh_bench"
harness = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
# NOTE: profiles are defined at the workspace root (../Cargo.toml); a
# [profile.*] table here would be ignored in a virtual workspace.

[lib]
name = "gaoya"
path = "src/lib.rs"
bench = false

[dependencies]
ahash = "0.8.12"
rand = "0.10.1"
rand_pcg = "0.3.1"
sha-1 = "0.10.1"
siphasher = "1.0.3"
random_choice = "0.3.2"
rayon = "1.12.0"
seahash = "4.1.0"
itertools = "0.14.0"
num-traits = "0.2.19"
shingles = "0.1.1"
smallvec = { version = "2.0.0-alpha.12", features = ["serde"] }
crossbeam-utils = "0.8.21"
triomphe = "0.1.15"
fnv = "1.0.7"

[features]
unstable = []






