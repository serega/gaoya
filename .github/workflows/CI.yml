name: CI

on:
  push:
    branches: [master, dev]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Because the crate is built with pyo3's abi3-py39 feature, a single wheel per
# platform is forward-compatible with every Python >= 3.9. Wheels are therefore
# built once per platform (no per-version matrix); the test job below is what
# exercises the individual interpreter versions.
jobs:
  # ---- Core Rust crate ----
  rust-test:
    name: cargo test (gaoya)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --verbose --package gaoya
      - run: cargo test --verbose --package gaoya

  # ---- Python bindings, every supported interpreter ----
  python-test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7
      - name: Build and test
        working-directory: py-gaoya
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e .
          uv pip install pytest
          .venv/bin/python -m pytest tests

  # ---- Wheels ----
  linux:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -m py-gaoya/Cargo.toml
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: auto
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  macos:
    # The Intel macos-13 runner has been retired, so build both arches on
    # Apple Silicon: x86_64 is cross-compiled via the x86_64-apple-darwin target.
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -m py-gaoya/Cargo.toml
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
          architecture: ${{ matrix.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -m py-gaoya/Cargo.toml
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist -m py-gaoya/Cargo.toml
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist

  # ---- Publish to PyPI on tag, via Trusted Publishing (OIDC, no secrets) ----
  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: [rust-test, python-test, linux, macos, windows, sdist]
    permissions:
      id-token: write       # OIDC token for PyPI Trusted Publishing
      contents: write       # create the GitHub release
      attestations: write   # build provenance attestations
    steps:
      - uses: actions/download-artifact@v7
      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_REPOSITORY: pypi
        with:
          command: upload
          args: --non-interactive --skip-existing wheels-*/*
