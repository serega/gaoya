[package]
name = "pygaoya"
version = "0.2.1"
authors = ["Sergey Melderis <sergey.melderis@gmail.com>"]
edition = "2024"
license = "MIT"
homepage = "https://github.com/serega/gaoya"
repository = "https://github.com/serega/gaoya"
description = "Locality Sensitive Hashing"

[lib]
name = "gaoya"
crate-type = ["cdylib"]

[package.metadata.release]
no-dev-version = true
disable-publish = true



[dependencies]
libc = "0.2.146"
pyo3 = { version = "0.28.3", features = ["extension-module", "abi3-py39"] }
rayon = "1.12.0"
shingles = "0.1.1"
fnv = "1.0.7"

[dependencies.gaoya]
version = "*"
path = "../gaoya"

[dev-dependencies]
tempfile = "3.2.0"

# NOTE: the macOS dynamic_lookup linker flags live in ../.cargo/config.toml,
# because rustflags is not honored under [target.*] in Cargo.toml.
#
# The release profile (lto = "fat", opt-level = 3) is defined at the workspace
# root (../Cargo.toml); a [profile.*] table here would be ignored.

